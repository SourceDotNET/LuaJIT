name: Build JIT

on:
  workflow_dispatch:
  push:

jobs:
  build-windows-64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate libs
        run: |
          cd src/
          .\msvcbuild.bat

      - uses: actions/upload-artifact@v4
        name: Upload Windows build (64x)
        with:
          name: windows-x64
          path: |
            src/luajit.exe
            src/lua51.dll
            src/lua51.lib
          retention-days: 1

  build-linux-64:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install Dependencies
        run: |
          apt update
          apt install -y build-essential

      - uses: actions/checkout@v4
        name: Checkout

      - name: Generate libs
        run: |
          cd src/
          make CC='$(DEFAULT_CC) -fPIC'

      - uses: actions/upload-artifact@v4
        name: Upload Linux build (64x)
        with:
          name: linux-x64
          path: |
            src/luajit
            src/libluajit.so
            src/libluajit.a
          retention-days: 1

  # Pushes to sourcenet replace the rolling "latest" prerelease,
  # pushing a tag creates a release named after the tag.
  release:
    needs: [build-windows-64, build-linux-64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/sourcenet' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        name: Download builds
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Latest build (${GITHUB_SHA::7})" \
              --notes "Automated build of $GITHUB_SHA from sourcenet."
          fi
