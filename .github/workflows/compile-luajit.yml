name: Build JIT

on:
  workflow_dispatch:
  push:

jobs:
  build-windows-64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate libs
        run: |
          cd src/
          .\msvcbuild.bat

      - uses: actions/upload-artifact@v4
        name: Upload Windows build (64x)
        with:
          name: win64
          path: |
            src/luajit.exe
            src/lua51.dll
            src/lua51.lib
          retention-days: 1

  build-linux-64:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install Dependencies
        run: |
          apt update
          apt install -y build-essential

      - uses: actions/checkout@v4
        name: Checkout

      - name: Generate libs
        run: |
          cd src/
          make CC='$(DEFAULT_CC) -fPIC'

      - uses: actions/upload-artifact@v4
        name: Upload Linux build (64x)
        with:
          name: linux64
          path: |
            src/luajit
            src/libluajit.so
            src/libluajit.a
          retention-days: 1

  # Commits the binaries to the "compiled" branch (win64/ and linux64/)
  # so other repos can pull them in as a submodule. The branch has no shared
  # history with the source.
  #
  # The commit is created through the GitHub API rather than `git push`, so
  # GitHub signs it and it shows as Verified. Each binary also gets a build
  # provenance attestation tying its hash to this workflow run and source
  # commit, checkable with: gh attestation verify <file> --repo <owner>/LuaJIT
  publish:
    needs: [build-windows-64, build-linux-64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sourcenet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: publish-compiled
    steps:
      - uses: actions/download-artifact@v4
        name: Download builds
        with:
          path: dist

      - uses: actions/attest-build-provenance@v2
        name: Attest build provenance
        with:
          subject-path: |
            dist/win64/*
            dist/linux64/*

      - name: Commit to compiled branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          repo="repos/$GITHUB_REPOSITORY"

          # Upload every file as a blob and build the tree from scratch.
          entries='[]'
          for f in win64/* linux64/*; do
            mode=100644
            [ "$f" = linux64/luajit ] && mode=100755
            blob=$(base64 -w0 "$f" | jq -Rs '{content: ., encoding: "base64"}' \
              | gh api "$repo/git/blobs" --input - --jq .sha)
            entries=$(jq -c --arg p "$f" --arg m "$mode" --arg s "$blob" \
              '. + [{path: $p, mode: $m, type: "blob", sha: $s}]' <<< "$entries")
          done
          tree=$(jq -n --argjson t "$entries" '{tree: $t}' \
            | gh api "$repo/git/trees" --input - --jq .sha)

          parent=$(gh api "$repo/git/ref/heads/compiled" --jq .object.sha 2>/dev/null || true)
          if [ -n "$parent" ]; then
            if [ "$(gh api "$repo/git/commits/$parent" --jq .tree.sha)" = "$tree" ]; then
              echo "No changes to commit"
              exit 0
            fi
            parents=$(jq -nc --arg p "$parent" '[$p]')
          else
            parents='[]'
          fi

          # No author/committer given, so GitHub signs the commit itself.
          message=$(printf 'Build %s\n\nBuilt from %s/%s/commit/%s\nWorkflow run: %s/%s/actions/runs/%s' \
            "${GITHUB_SHA::7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          commit=$(jq -n --arg m "$message" --arg t "$tree" --argjson p "$parents" \
            '{message: $m, tree: $t, parents: $p}' \
            | gh api "$repo/git/commits" --input - --jq .sha)

          if [ -n "$parent" ]; then
            gh api -X PATCH "$repo/git/refs/heads/compiled" -f sha="$commit" > /dev/null
          else
            gh api "$repo/git/refs" -f ref=refs/heads/compiled -f sha="$commit" > /dev/null
          fi
          echo "compiled -> $commit"
