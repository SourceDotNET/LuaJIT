name: Build JIT

on:
  workflow_dispatch:
  push:

jobs:
  build-windows-64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate libs
        run: |
          cd src/
          .\msvcbuild.bat

      - uses: actions/upload-artifact@v4
        name: Upload Windows build (64x)
        with:
          name: win64
          path: |
            src/luajit.exe
            src/lua51.dll
            src/lua51.lib
          retention-days: 1

  build-linux-64:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install Dependencies
        run: |
          apt update
          apt install -y build-essential

      - uses: actions/checkout@v4
        name: Checkout

      - name: Generate libs
        run: |
          cd src/
          make CC='$(DEFAULT_CC) -fPIC'

      - uses: actions/upload-artifact@v4
        name: Upload Linux build (64x)
        with:
          name: linux64
          path: |
            src/luajit
            src/libluajit.so
            src/libluajit.a
          retention-days: 1

  # Commits the binaries to the "compiled" branch (win64/ and linux64/)
  # so other repos can pull them in as a submodule.
  publish:
    needs: [build-windows-64, build-linux-64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sourcenet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-compiled
    steps:
      - uses: actions/download-artifact@v4
        name: Download builds
        with:
          path: ${{ runner.temp }}/dist

      # Built in an empty repo so the branch never shares history with the source.
      - name: Commit to compiled branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir compiled && cd compiled
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch -q --depth 1 origin compiled; then
            git checkout -q -B compiled FETCH_HEAD
          else
            git checkout -q --orphan compiled
          fi

          rm -rf win64 linux64
          cp -r "$RUNNER_TEMP/dist/win64" "$RUNNER_TEMP/dist/linux64" .
          chmod +x linux64/luajit

          git add -A win64 linux64
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Build ${GITHUB_SHA::7}" \
            -m "Built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          git push origin compiled
