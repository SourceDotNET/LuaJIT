name: Build JIT

on:
  workflow_dispatch:
  push:

jobs:
  build-windows-64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate libs
        run: |
          cd src/
          .\msvcbuild.bat static
          ren lua51.lib lua51_64.lib
          ren luajit.lib luajit_64.lib

      - uses: actions/upload-artifact@v4
        name: Upload lua51.lib
        with:
          name: lua51_64.lib
          path: src/lua51_64.lib
          retention-days: 1

      - uses: actions/upload-artifact@v4
        name: Upload luajit executable (64x)
        with:
          name: luajit.exe (64x)
          path: src/luajit.exe
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: false
        name: Upload luajit.lib
        with:
          name: luajit_64.lib
          path: src/luajit_64.lib
          retention-days: 1

  build-linux-64:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install Dependencies
        run: |
          apt update
          apt install -y build-essential

      - uses: actions/checkout@v4
        name: Checkout

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Generate libs
        run: |
          cd src/
          make CC='$(DEFAULT_CC) -fPIC'
          mv libluajit.a libluajit_64.a

      - uses: actions/upload-artifact@v4
        name: Upload libluajit.a (64x)
        with:
          name: libluajit_64.a
          path: src/libluajit_64.a
          retention-days: 1

      - uses: actions/upload-artifact@v4
        name: Upload luajit executable (64x)
        with:
          name: luajit (64x)
          path: src/luajit
          retention-days: 1